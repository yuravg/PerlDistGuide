name    = Example4-Hello
author  = Your Name <email@example.com>
license = Perl_5
copyright_holder = Your Name
copyright_year   = 2025

version = 0.001

; Version injection
[OurPkgVersion]      ; Injects 'our $VERSION' at # VERSION markers in modules

; File gathering and filtering
[GatherDir]          ; Collects all files from the distribution directory
exclude_filename = Makefile.PL

[AutoPrereqs]        ; Automatically detects dependencies from 'use' statements
[PruneCruft]         ; Removes editor backup files and other cruft
[ManifestSkip]       ; Excludes files matching MANIFEST.SKIP patterns

; Metadata generation
[MetaYAML]           ; Generates META.yml for CPAN
[MetaJSON]           ; Generates META.json for CPAN

; Documentation and licensing
[License]            ; Generates LICENSE file from license metadata
[Readme]             ; Generates README from POD documentation

; Testing and execution
[ExtraTests]         ; Moves xt/ tests to t/ for author testing
[ExecDir]            ; Includes executable scripts from bin/ directory
[ShareDir]           ; Includes shared files from share/ directory

; Build system
[MakeMaker]          ; Generates Makefile.PL for traditional Perl installation

; Distribution management
[Manifest]           ; Generates MANIFEST file listing all distribution files
[TestRelease]        ; Runs tests before allowing release
[ConfirmRelease]     ; Requires confirmation before uploading to CPAN
[UploadToCPAN]       ; Uploads distribution to CPAN

; Testing plugins
[Test::Compile]      ; Tests that all modules compile correctly
